<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Яндекс Музыка → Spotify</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2129; --muted:#6b7280; --line:#e5e7eb;
          --accent:#1db954; --accent-dark:#169c46; --warn:#b45309; --err:#b91c1c; --ok-bg:#ecfdf3; --err-bg:#fef2f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --card:#1b1e23; --text:#e7e9ee; --muted:#9aa1ad; --line:#2b2f36;
            --ok-bg:#0f2a1b; --err-bg:#2c1414; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header nav a { margin-right:14px; color:var(--text); text-decoration:none; }
  header nav a:hover { color:var(--accent); }
  main { max-width:980px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  .card h2 { font-size:16px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .step { display:inline-flex; width:24px; height:24px; border-radius:50%; background:var(--line); align-items:center; justify-content:center; font-size:13px; }
  .step.done { background:var(--accent); color:#fff; }
  label { display:block; margin:8px 0 4px; color:var(--muted); font-size:13px; }
  input[type=text], input[type=number], input[type=password] { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .row > * { flex:1 1 200px; }
  button, .btn { display:inline-block; padding:8px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; cursor:pointer; text-decoration:none; }
  button:hover, .btn:hover { background:var(--accent-dark); }
  button.secondary, .btn.secondary { background:transparent; color:var(--text); border-color:var(--line); }
  button.danger { background:transparent; color:var(--err); border-color:var(--err); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .muted { color:var(--muted); font-size:13px; }
  .flash { padding:10px 14px; border-radius:8px; margin-bottom:16px; background:var(--ok-bg); }
  .flash.error { background:var(--err-bg); color:var(--err); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:10px 0; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .stat b { display:block; font-size:20px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .3s; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; border:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .cand { display:flex; gap:8px; align-items:baseline; margin:3px 0; }
  .score { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; min-width:36px; }
  .tabs a { margin-right:10px; }
  .tabs a.active { font-weight:600; color:var(--accent); }
  a { color:var(--accent); }
  .why { color:var(--warn); font-size:12px; }
  details summary { cursor:pointer; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Яндекс Музыка → Spotify</h1>
  <nav>
    <a href="/">Главная</a>
    <a href="/review">Проверка</a>
    <a href="/report.csv">Отчёт CSV</a>
    <a href="/not_found.csv">Ненайденные CSV</a>
  </nav>
</header>
<main>
{% if flash %}<div class="flash {{ flash.kind }}">{{ flash.text }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
