[project]
name = "yandex-music-to-spotify"
version = "1.2.0"
description = "Локальный сервис переноса лайков и плейлистов из Яндекс Музыки в Spotify"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx[socks]>=0.27",
    "yandex-music>=3.2.2",
    "rapidfuzz>=3.9", "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# это приложение, а не библиотека: ставим только зависимости
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
